[project]
name = "api-course"
version = "0.2.0"
description = "Introduction to APIs with FastAPI: course material and auto-graded labs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.0",
    "httpx2>=2.16.0",
    "pydantic>=2.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["lab"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
